<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="tile" x1="18" y1="10" x2="110" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FBFF"/>
      <stop offset="0.55" stop-color="#E4F0FC"/>
      <stop offset="1" stop-color="#D0E4F7"/>
    </linearGradient>
    <linearGradient id="tab" x1="40" y1="28" x2="88" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5BB0FF"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="tabHilite" x1="44" y1="30" x2="84" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Squircle shell -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#tile)" stroke="#C5D8EC" stroke-width="1.25"/>
  <!-- Divider (browser chrome line) -->
  <path d="M28 64 H100" stroke="#8FAEC9" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <!-- Abstract tab resting on the divider -->
  <rect x="38" y="30" width="52" height="34" rx="10" fill="url(#tab)"/>
  <rect x="38" y="30" width="52" height="14" rx="10" fill="url(#tabHilite)"/>
  <!-- Soft tab top sheen -->
  <circle cx="48" cy="38" r="3.2" fill="#FFFFFF" opacity="0.45"/>
</svg>
